<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unregister Service Worker - IPDC Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
      margin: 8px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .button.secondary {
      background: #6c757d;
    }

    .log {
      margin-top: 24px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      font-size: 14px;
      max-height: 300px;
      overflow-y: auto;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #dee2e6;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .success {
      color: #28a745;
    }

    .error {
      color: #dc3545;
    }

    .info {
      color: #17a2b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Service Worker Utility</h1>
    <p>
      Use this page to unregister the old service worker and clear all caches.
      This will force the app to download and register the latest version.
    </p>

    <div>
      <button class="button" onclick="unregisterAll()">
        Unregister Service Worker
      </button>
      <button class="button secondary" onclick="clearAllCaches()">
        Clear All Caches
      </button>
      <button class="button" onclick="doItAll()">
        Do Everything
      </button>
    </div>

    <div class="log" id="log" style="display: none;"></div>

    <div style="margin-top: 24px;">
      <a href="/" class="button">
        Return to App
      </a>
    </div>
  </div>

  <script>
    const logElement = document.getElementById('log');

    function log(message, type = 'info') {
      logElement.style.display = 'block';
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logElement.appendChild(entry);
      logElement.scrollTop = logElement.scrollHeight;
    }

    async function unregisterAll() {
      log('Starting service worker unregistration...', 'info');

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();

          if (registrations.length === 0) {
            log('No service workers registered', 'info');
            return;
          }

          for (const registration of registrations) {
            await registration.unregister();
            log(`✅ Unregistered service worker: ${registration.scope}`, 'success');
          }

          log('All service workers unregistered successfully!', 'success');
        } else {
          log('Service Workers not supported in this browser', 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    async function clearAllCaches() {
      log('Starting cache clearing...', 'info');

      try {
        const cacheNames = await caches.keys();

        if (cacheNames.length === 0) {
          log('No caches found', 'info');
          return;
        }

        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          log(`✅ Deleted cache: ${cacheName}`, 'success');
        }

        log('All caches cleared successfully!', 'success');
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    async function doItAll() {
      log('Starting complete cleanup...', 'info');
      await unregisterAll();
      await clearAllCaches();

      if ('indexedDB' in window) {
        try {
          const dbs = await indexedDB.databases();
          if (dbs && dbs.length > 0) {
            for (const db of dbs) {
              if (db.name.includes('firestore') || db.name.includes('ipdc')) {
                log(`Found database: ${db.name}`, 'info');
              }
            }
          }
        } catch (error) {
          log(`Info: Could not list databases (normal on some browsers)`, 'info');
        }
      }

      log('✨ Complete! Please refresh the page.', 'success');

      setTimeout(() => {
        if (confirm('Cleanup complete! Refresh the page now?')) {
          window.location.href = '/';
        }
      }, 2000);
    }
  </script>
</body>
</html>
